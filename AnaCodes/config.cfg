# HV scan analysis config
#
# Format:
#   [HistogramType]
#   pattern = <ROOT histogram name pattern using %d for pixel indices>
#   class   = TH1D | TH2D
#   extractors = <comma-separated list of extractor names>
#
# Supported extractor names (see HVScanAnalyzer.cc, registerExtractors()):
#   mean, rms, entries, gausMean, gausSigma, gausAmp, peakPos

[h_U_clSize]
pattern     = h_U_clSize_%d_%d
class       = TH1D
extractors  = mean, rms

[h_U_ClStartTime]
pattern     = h_U_ClStartTime_%d_%d
class       = TH1D
extractors  = mean, rms, gausMean, gausSigma

[h_V_clSize]
pattern     = h_V_clSize_%d_%d
class       = TH1D
extractors  = mean, rms
